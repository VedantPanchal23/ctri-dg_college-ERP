services:
  mysql:
    image: mysql:8.0
    container_name: ca-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: college_admin
      MYSQL_USER: ca_user
      MYSQL_PASSWORD: ca_pass
    ports:
      - "3306:3306"
    volumes:
      - ca_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: ca-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ca-app
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/college_admin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ca_user
      SPRING_DATASOURCE_PASSWORD: ca_pass
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://keycloak:8081/realms/college-admin
      APP_SECURITY_JWK_SET_URI: http://keycloak:8081/realms/college-admin/protocol/openid-connect/certs
    ports:
      - "8080:8080"

volumes:
  ca_mysql_data:
