services:
  mysql:
    image: mysql:8.0
    container_name: ca-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: college_admin
      MYSQL_USER: ca_user
      MYSQL_PASSWORD: ca_pass
    ports:
      - "3306:3306"
    volumes:
      - ca_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - ca-net

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    container_name: ca-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8081
      # Tokens issued for browser clients use localhost (not the Docker DNS name).
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8081
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s
    networks:
      - ca-net

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ca-app
    depends_on:
      mysql:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/college_admin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ca_user
      SPRING_DATASOURCE_PASSWORD: ca_pass
      # Issuer must match the `iss` claim in browser-issued tokens (localhost).
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI: http://localhost:8081/realms/college-admin
      # Keys are fetched over the Docker network.
      APP_SECURITY_JWK_SET_URI: http://keycloak:8081/realms/college-admin/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
      APP_KEYCLOAK_ADMIN_ENABLED: "true"
      APP_KEYCLOAK_ADMIN_URL: http://keycloak:8081
      APP_KEYCLOAK_ADMIN_USERNAME: admin
      APP_KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    networks:
      - ca-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: ""
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: college-admin
        VITE_KEYCLOAK_CLIENT_ID: college-admin-web
    container_name: ca-frontend
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - ca-net

volumes:
  ca_mysql_data:

networks:
  ca-net:
    name: ca-net
