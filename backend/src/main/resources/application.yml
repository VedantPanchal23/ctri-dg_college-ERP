spring:
  application:
    name: college-admin
  datasource:
    url: jdbc:mysql://localhost:3306/college_admin?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ca_user
    password: ca_pass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${APP_JWT_ISSUER_URI:http://localhost:8081/realms/college-admin}

server:
  port: 8080
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwk-set-uri: ${APP_SECURITY_JWK_SET_URI:}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://127.0.0.1:5173,http://127.0.0.1:3000}
  keycloak:
    admin:
      enabled: ${APP_KEYCLOAK_ADMIN_ENABLED:true}
      server-url: ${APP_KEYCLOAK_ADMIN_URL:http://localhost:8081}
      realm: ${APP_KEYCLOAK_ADMIN_REALM:college-admin}
      username: ${APP_KEYCLOAK_ADMIN_USERNAME:admin}
      password: ${APP_KEYCLOAK_ADMIN_PASSWORD:admin}

logging:
  level:
    in.ac.iiitb.ca: INFO
    org.springframework.security: INFO
